name: Deploy Website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/deploy-website.yml']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: reports
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to Azure App Service
        run: |
          cd website
          zip -r /tmp/deploy.zip . -x "node_modules/*" ".astro/*" "src/*"
          az webapp deploy --resource-group rg-tech-research-feed \
            --name app-tech-research-feed \
            --src-path /tmp/deploy.zip \
            --type zip
