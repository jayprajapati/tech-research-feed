name: Generate Daily Report
on:
  schedule:
    - cron: '30 0 * * 1-5'  # 6:00 AM IST, Mon-Fri
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report type'
        default: 'daily-pulse'
        type: choice
        options: [daily-pulse, weekly-review, swing-analysis, portfolio-audit]
      report_date:
        description: 'Date (YYYY-MM-DD, blank = today)'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r ../../requirements.txt
      - run: python research.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ vars.MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || 'reports' }}
          REPORT_TYPE: ${{ inputs.report_type || 'daily-pulse' }}
          REPORT_DATE: ${{ inputs.report_date || '' }}
